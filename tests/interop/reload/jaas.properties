# Acceptor reload: broker properties put in place with acceptors-after.xml.
# The activemq realm becomes a guest login, so a client without credentials
# logs in once they are reloaded.
jaasConfigs.activemq.modules.guest.loginModuleClass=org.apache.activemq.artemis.spi.core.security.jaas.GuestLoginModule
jaasConfigs.activemq.modules.guest.controlFlag=required
jaasConfigs.activemq.modules.guest.params."org.apache.activemq.jaas.guest.user"=guest
jaasConfigs.activemq.modules.guest.params."org.apache.activemq.jaas.guest.role"=amq
