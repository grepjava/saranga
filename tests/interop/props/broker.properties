# Broker properties applied over the golden broker.xml by both brokers.

# The activemq realm is replaced: the anonymous guest of login.config is gone.
jaasConfigs.activemq.modules.props.loginModuleClass=org.apache.activemq.artemis.spi.core.security.jaas.PropertiesLoginModule
jaasConfigs.activemq.modules.props.controlFlag=required
jaasConfigs.activemq.modules.props.params."org.apache.activemq.jaas.properties.user"=props-users.properties
jaasConfigs.activemq.modules.props.params."org.apache.activemq.jaas.properties.role"=props-roles.properties

# Writers may send and create on props.#, readers may consume.
securityRoles."props.#".writers.send=true
securityRoles."props.#".writers.createAddress=true
securityRoles."props.#".writers.createDurableQueue=true
securityRoles."props.#".readers.consume=true
securityRoles."props.#".readers.browse=true

# A pre-created anycast queue, and no auto-creation under props.fixed.
addressConfigurations."props.a".routingTypes=ANYCAST
addressConfigurations."props.a".queueConfigs."props.a".routingType=ANYCAST
addressSettings."props.fixed.#".autoCreateAddresses=false
addressSettings."props.fixed.#".autoCreateQueues=false
