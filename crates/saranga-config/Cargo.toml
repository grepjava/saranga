[package]
name = "saranga-config"
description = "broker.xml parsing, address settings and the wildcard match hierarchy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
saranga-buffer = { path = "../saranga-buffer" }
saranga-filter = { path = "../saranga-filter" }
regex = "1"
roxmltree = "0.21"
thiserror = "2"
tracing = "0.1"
blowfish = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.9"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
