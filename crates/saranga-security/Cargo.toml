[package]
name = "saranga-security"
description = "Authentication and authorization: JAAS login modules, security settings and the security store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
saranga-buffer = { path = "../saranga-buffer" }
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
p12-keystore = "0.4"
rustls-pki-types = { version = "1", features = ["std"] }
sha1 = "0.10"
x509-parser = "0.18"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
saranga-config = { path = "../saranga-config" }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
