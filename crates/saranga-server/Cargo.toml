[package]
name = "saranga-server"
description = "The Saranga broker: post office, queues, sessions and the Core protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
saranga-buffer = { path = "../saranga-buffer" }
saranga-client = { path = "../saranga-client" }
saranga-config = { path = "../saranga-config" }
saranga-core-protocol = { path = "../saranga-core-protocol" }
saranga-fault = { path = "../saranga-fault" }
saranga-filter = { path = "../saranga-filter" }
saranga-ha = { path = "../saranga-ha" }
saranga-journal = { path = "../saranga-journal" }
saranga-storage = { path = "../saranga-storage" }
saranga-message = { path = "../saranga-message" }
saranga-paging = { path = "../saranga-paging" }
saranga-security = { path = "../saranga-security" }
saranga-transport = { path = "../saranga-transport" }
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
saranga-fault = { path = "../saranga-fault", features = ["inject"] }
tokio = { version = "1", features = ["test-util"] }
