[package]
name = "saranga-cli"
description = "The saranga command: run and manage a broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "saranga"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mimalloc = { version = "0.1", default-features = false, optional = true }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
saranga-config = { path = "../saranga-config" }
saranga-buffer = { path = "../saranga-buffer" }
saranga-journal = { path = "../saranga-journal" }
saranga-message = { path = "../saranga-message" }
saranga-paging = { path = "../saranga-paging" }
saranga-security = { path = "../saranga-security" }
saranga-protocol-amqp = { path = "../saranga-protocol-amqp" }
saranga-protocol-mqtt = { path = "../saranga-protocol-mqtt" }
saranga-protocol-openwire = { path = "../saranga-protocol-openwire" }
saranga-protocol-stomp = { path = "../saranga-protocol-stomp" }
saranga-server = { path = "../saranga-server" }
saranga-ha = { path = "../saranga-ha" }
saranga-storage = { path = "../saranga-storage" }
saranga-transport = { path = "../saranga-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
saranga-client = { path = "../saranga-client" }
saranga-filter = { path = "../saranga-filter" }
saranga-management = { path = "../saranga-management" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["mimalloc"]
