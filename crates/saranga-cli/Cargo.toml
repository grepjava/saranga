[package]
name = "saranga-cli"
description = "The saranga command: run and manage a broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "saranga"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
saranga-config = { path = "../saranga-config" }
saranga-paging = { path = "../saranga-paging" }
saranga-server = { path = "../saranga-server" }
saranga-storage = { path = "../saranga-storage" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
