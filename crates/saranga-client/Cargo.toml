[package]
name = "saranga-client"
description = "Async Artemis Core protocol client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
saranga-buffer = { path = "../saranga-buffer" }
saranga-core-protocol = { path = "../saranga-core-protocol" }
saranga-message = { path = "../saranga-message" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
saranga-config = { path = "../saranga-config" }
saranga-server = { path = "../saranga-server" }
saranga-ha = { path = "../saranga-ha" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
