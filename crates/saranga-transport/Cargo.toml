[package]
name = "saranga-transport"
description = "Acceptors: TLS with Java keystores, client certificates and SNI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p12-keystore = "0.4"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
saranga-config = { path = "../saranga-config" }
saranga-security = { path = "../saranga-security" }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
