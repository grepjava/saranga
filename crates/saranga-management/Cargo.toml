[package]
name = "saranga-management"
description = "The broker's web server: the REST management API, Prometheus metrics and a Jolokia compatibility layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tower = "0.5"
flate2 = "1"
httpdate = "1"
rand = "0.9"
roxmltree = "0.21"
saranga-buffer = { path = "../saranga-buffer" }
saranga-client = { path = "../saranga-client" }
saranga-config = { path = "../saranga-config" }
saranga-core-protocol = { path = "../saranga-core-protocol" }
saranga-security = { path = "../saranga-security" }
saranga-server = { path = "../saranga-server" }
saranga-transport = { path = "../saranga-transport" }
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[build-dependencies]
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util"] }
