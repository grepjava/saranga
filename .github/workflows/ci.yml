name: ci
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rust client against saranga run
        shell: bash
        run: |
          cargo build -p saranga-cli
          mkdir -p "$RUNNER_TEMP/instance/etc" && cp tests/golden/etc/broker.xml "$RUNNER_TEMP/instance/etc/"
          target/debug/saranga run --config "$RUNNER_TEMP/instance/etc/broker.xml" --bind 127.0.0.1:61616 &
          for _ in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/61616) 2>/dev/null && break; sleep 0.2; done
          SARANGA_TEST_BROKER=127.0.0.1:61616 cargo test -p saranga-client --test broker

  # The console (console/): its formatting, types, unit and component
  # tests, and that its client is generated from the API's document; then
  # a broker with the pages built in, checked by the console suite with
  # Playwright driving the pages.
  console:
    runs-on: ubuntu-latest
    env:
      SARANGA_CONSOLE_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check
        working-directory: console
        run: |
          npm run lint
          npm run check
          npm run api && git diff --exit-code src/lib/api/schema.d.ts
          npm test
          npm run build
      - run: bash tests/interop/console/api.sh

  # Phase 9's exit check: a Java broker and a Saranga broker as each
  # other's backup, failing over and back under load without losing a
  # committed message. Artemis 2.57.0 is tagged but not published, so its
  # distribution is built from the tag once and cached.
  ha:
    runs-on: ubuntu-latest
    env:
      ARTEMIS_VERSION: 2.57.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - id: artemis
        uses: actions/cache@v4
        with:
          path: reference/activemq-artemis/artemis-distribution/target/apache-artemis-2.57.0-bin
          key: artemis-dist-2.57.0
      - name: Build the Artemis distribution
        if: steps.artemis.outputs.cache-hit != 'true'
        run: |
          git clone -c core.autocrlf=false --depth 1 --branch "$ARTEMIS_VERSION" https://github.com/apache/activemq-artemis.git reference/activemq-artemis
          cd reference/activemq-artemis
          mvn -B -ntp install -pl artemis-distribution -am -DskipTests -Dcheckstyle.skip -Drat.skip -Denforcer.skip -Dmaven.javadoc.skip
      - name: Java primary, Saranga backup
        run: PRIMARY=artemis BACKUP=saranga tests/interop/ha/no-loss.sh
      - name: Saranga primary, Java backup
        run: PRIMARY=saranga BACKUP=artemis tests/interop/ha/no-loss.sh

  # Phase 11: the chaos proxy delays, black-holes, cuts, refuses and drops
  # the links of a bridge, a cluster, a federation, a mirror and a
  # replicated pair under load, Java and Saranga on each side, with nothing
  # committed lost and nothing received twice.
  # Then the linearizability runs: HA pairs under the same faults while
  # their nodes are killed, each client history checked against a queue.
  chaos:
    runs-on: ubuntu-latest
    env:
      ARTEMIS_VERSION: 2.57.0
      DURATION: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - id: artemis
        uses: actions/cache@v4
        with:
          path: reference/activemq-artemis/artemis-distribution/target/apache-artemis-2.57.0-bin
          key: artemis-dist-2.57.0
      - name: Build the Artemis distribution
        if: steps.artemis.outputs.cache-hit != 'true'
        run: |
          git clone -c core.autocrlf=false --depth 1 --branch "$ARTEMIS_VERSION" https://github.com/apache/activemq-artemis.git reference/activemq-artemis
          cd reference/activemq-artemis
          mvn -B -ntp install -pl artemis-distribution -am -DskipTests -Dcheckstyle.skip -Drat.skip -Denforcer.skip -Dmaven.javadoc.skip
      - run: scripts/chaos-soak.sh bridge artemis saranga
      - run: scripts/chaos-soak.sh cluster saranga artemis
      - run: scripts/chaos-soak.sh federation artemis saranga
      - run: scripts/chaos-soak.sh mirror saranga artemis
      - run: scripts/chaos-soak.sh replication saranga artemis
      - run: scripts/linearizability.sh shared-store saranga artemis
      - run: scripts/linearizability.sh replication artemis saranga
      - run: scripts/linearizability.sh pluggable saranga artemis

  # Phase 11: producers fill a 64 MiB tmpfs, held back by max-disk-usage
  # and run out of space, with nothing acknowledged lost.
  disk-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/disk-soak.sh 120

  # Phase 11: the web suite. Saranga serves the Artemis distribution's
  # console, and every console and Jolokia request is compared with an
  # Artemis 2.57.0 container's answer. On a cache hit only the
  # distribution is restored, so artemis-docker is fetched for the image.
  web:
    runs-on: ubuntu-latest
    env:
      ARTEMIS_VERSION: 2.57.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: artemis
        uses: actions/cache@v4
        with:
          path: reference/activemq-artemis/artemis-distribution/target/apache-artemis-2.57.0-bin
          key: artemis-dist-2.57.0
      - name: Build the Artemis distribution
        if: steps.artemis.outputs.cache-hit != 'true'
        run: |
          git clone -c core.autocrlf=false --depth 1 --branch "$ARTEMIS_VERSION" https://github.com/apache/activemq-artemis.git reference/activemq-artemis
          cd reference/activemq-artemis
          mvn -B -ntp install -pl artemis-distribution -am -DskipTests -Dcheckstyle.skip -Drat.skip -Denforcer.skip -Dmaven.javadoc.skip
      - name: Build the Artemis image
        run: |
          if [[ ! -d reference/activemq-artemis/artemis-docker ]]; then
            git clone -c core.autocrlf=false --depth 1 --branch "$ARTEMIS_VERSION" --filter=blob:none --sparse https://github.com/apache/activemq-artemis.git "$RUNNER_TEMP/artemis"
            git -C "$RUNNER_TEMP/artemis" sparse-checkout set artemis-docker
            cp -r "$RUNNER_TEMP/artemis/artemis-docker" reference/activemq-artemis/
          fi
          bash scripts/build-artemis.sh
      - run: bash tests/interop/web/web.sh

  # Phase 11: every codec under cargo-fuzz for a short time, seeded from
  # the golden corpus. An input a target fails on is uploaded.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - run: JOBS=4 scripts/fuzz.sh 60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
