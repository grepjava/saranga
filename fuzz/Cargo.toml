[package]
name = "saranga-fuzz-targets"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
saranga-fuzz = { path = "../crates/saranga-fuzz" }

# Not a member of the repository's workspace: cargo-fuzz builds it on its
# own, with nightly and the sanitizer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "buffer"
path = "fuzz_targets/buffer.rs"
test = false
doc = false
bench = false

