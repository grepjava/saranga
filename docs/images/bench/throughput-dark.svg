<text x="24" y="36" font-size="16" font-weight="600" fill="#f0efec">Throughput: Saranga against Artemis</text><text x="24" y="59" font-size="12.5" fill="#c3c2b7">Messages received a second with an unbounded producer, as a multiple of Artemis's.</text><text x="24" y="77" font-size="12.5" fill="#c3c2b7">Past the line Saranga is faster; short of it, slower.</text><line x1="200" x2="200" y1="100" y2="460" stroke="#383835" stroke-width="1"/><text x="200" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0×</text><line x1="294" x2="294" y1="100" y2="460" stroke="#2c2c2a" stroke-width="1"/><text x="294" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.5×</text><line x1="388" x2="388" y1="100" y2="460" stroke="#2c2c2a" stroke-width="1"/><text x="388" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1×</text><line x1="482" x2="482" y1="100" y2="460" stroke="#2c2c2a" stroke-width="1"/><text x="482" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1.5×</text><line x1="576" x2="576" y1="100" y2="460" stroke="#2c2c2a" stroke-width="1"/><text x="576" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2×</text><line x1="670" x2="670" y1="100" y2="460" stroke="#2c2c2a" stroke-width="1"/><text x="670" y="476" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2.5×</text><line x1="388" x2="388" y1="94" y2="460" stroke="#c3c2b7" stroke-width="1.5"/><text x="388" y="90" font-size="11" fill="#c3c2b7" text-anchor="middle">Artemis</text><text x="188" y="119" font-size="12.5" fill="#f0efec" text-anchor="end">Core</text><path d="M200 107h197.0925377867033a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-197.0925377867033z" fill="#3987e5"><title>Core, Saranga: 1.07×</title></path><text x="407.0925377867033"