<title id="title">Throughput: Saranga against Artemis</title>
<desc id="desc">Core: Java client 1.07×, Rust client 1.90×; Core, persistent: Java client 1.21×, Rust client 1.40×; Core, 1 MiB persistent: Java client 1.34×, Rust client no Rust client; AMQP: Java client 0.93×, Rust client 1.22×; AMQP, persistent: Java client 1.22×, Rust client 2.36×; AMQP, 1 MiB persistent: Java client 1.18×, Rust client no Rust client; OpenWire: Java client 1.36×, Rust client no Rust client; OpenWire, persistent: Java client 2.35×, Rust client no Rust client; STOMP: Java client 1.47×, Rust client 1.55×; STOMP, persistent: Java client 1.28×, Rust client 1.34×; MQTT, QoS 0: Java client 1.66×, Rust client 1.69×; MQTT, QoS 1: Java client 2.14×, Rust client 2.17×</desc>
