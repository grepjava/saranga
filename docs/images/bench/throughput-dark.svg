<text x="24" y="36" font-size="16" font-weight="600" fill="#f0efec">Throughput: Saranga against Artemis</text><text x="24" y="59" font-size="12.5" fill="#c3c2b7">Messages received a second with an unbounded producer, Saranga's as a multiple of Artemis's with the same</text><text x="24" y="77" font-size="12.5" fill="#c3c2b7">client. Past the line Saranga is faster; short of it, slower.</text><rect x="24" y="90" width="12" height="12" rx="3" fill="#3987e5"/><text x="42" y="100" font-size="12.5" fill="#f0efec">Java client</text><rect x="146.5" y="90" width="12" height="12" rx="3" fill="#d95926"/><text x="164.5" y="100" font-size="12.5" fill="#f0efec">Rust client</text><line x1="200" x2="200" y1="126" y2="654" stroke="#383835" stroke-width="1"/><text x="200" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0×</text><line x1="294" x2="294" y1="126" y2="654" stroke="#2c2c2a" stroke-width="1"/><text x="294" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.5×</text><line x1="388" x2="388" y1="126" y2="654" stroke="#2c2c2a" stroke-width="1"/><text x="388" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1×</text><line x1="482" x2="482" y1="126" y2="654" stroke="#2c2c2a" stroke-width="1"/><text x="482" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1.5×</text><line x1="576" x2="576" y1="126" y2="654" stroke="#2c2c2a" stroke-width="1"/><text x="576" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2×</text><line x1="670" x2="670" y1="126" y2="654" stroke="#2c2c2a" stroke-width="1"/><text x="670" y="670" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2.5×</text><line x1="388" x2="388" y1="120" y2="654" stroke="#c3c2b7" stroke-width="1.5"/><text x="388" y="116" font-si