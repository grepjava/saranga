<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Broker CPU a message: lower is better</text><text x="24" y="59" font-size="12.5" fill="#52514e">Microseconds of the broker's CPU time for each message, with both brokers at the same rate.</text><rect x="24" y="72" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="82" font-size="12.5" fill="#0b0b0b">Saranga</text><rect x="116.5" y="72" width="12" height="12" rx="3" fill="#eb6834"/><text x="134.5" y="82" font-size="12.5" fill="#0b0b0b">Artemis</text><line x1="200" x2="200" y1="108" y2="548" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="564" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0 µs</text><line x1="317.5" x2="317.5" y1="108" y2="548" stroke="#e1e0d9" stroke-width="1"/><text x="317.5" y="564" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50 µs</text><line x1="435" x2="435" y1="108" y2="548" stroke="#e1e0d9" stroke-width="1"/><text x="435" y="564" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100 µs</text><line x1="552.5" x2="552.5" y1="108" y2="548" stroke="#e1e0d9" stroke-width="1"/><text x="552.5" y="564" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">150 µs</text><line x1="670" x2="670" y1="108" y2="548" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="564" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200 µs</text><text x="188" y="134" font-size="12.5" fill="#0b0b0b" text-anchor="end">Core</text><path d="M200 115h75.89999999999998a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-75.89999999999998z" fill="#2a78d6"><title>Core, Saranga: 34 µs</title></path><text x="285.9" y="126" font-size="11.5" fill="#52514e" stroke="#fcfcfb" stroke-width="3" paint-order="stroke" style="font-variant-numeric: tabular-nums">34 µs</text><path d="M200 131h146.3999999999999