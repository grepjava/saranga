<title id="title">Latency (p50): lower is better</title>
<desc id="desc">Without persistence, Core: Saranga 111 µs, Artemis 146 µs; Without persistence, AMQP: Saranga 114 µs, Artemis 125 µs; Without persistence, OpenWire: Saranga 148 µs, Artemis 184 µs; Without persistence, STOMP: Saranga 60 µs, Artemis 81 µs; Without persistence, MQTT, QoS 0: Saranga 62 µs, Artemis 84 µs; Persistent, Core, persistent: Saranga 1.2 ms, Artemis 4.1 ms; Persistent, AMQP, persistent: Saranga 1.6 ms, Artemis 3.6 ms; Persistent, OpenWire, persistent: Saranga 2.5 ms, Artemis 4.5 ms; Persistent, STOMP, persistent: Saranga 1.4 ms, Artemis 4.1 ms; Persistent, MQTT, QoS 1: Saranga 0.8 ms, Artemis 2.9 ms; Persistent, Core, 100 queues: Saranga 1.1 ms, Artemis 3.2 ms</desc>
<rect width="760" height="728" rx="8" fill="#fcfcfb"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Latency (p50): lower is better</text><text x="24" y="59" font-size="12.5" fill="#52514e">Send to receipt, with both brokers at the same rate, half the lower of their two throughputs.</text><rect x="24" y="72" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="82" font-size="12.5" fill="#0b0b0b">Saranga</text><rect x="116.5" y="72" width="12" height="12" rx="3" fill="#eb6834"/><text x="134.5" y="82" font-size="12.5" fill="#0b0b0b">Artemis</text><text x="24" y="122" font-size="13" font-weight="600" fill="#0b0b0b">Without persistence</text><line x1="200" x2="200" y1="134" y2="354" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="370" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0 µs</text><line x1="317.5" x2="317.5" y1="134" y2="354" stroke="#e1e0d9" stroke-width="1"/><text x="317.5" y="370" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50 µs</text><line x1="435" x2="435" y1="134" y2="354" stroke="#e1e0d9" stroke-width="1"/><text x="435" y="370" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100 µs</text><line x1="552.5" x2="552.5" y1="134" y2="354" stroke="#e1e0d9" stroke-width="1"/><text x="552.5" y="370" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">150 µs</text><line x1="670" x2="670" y1="134" y2="354" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="370" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200 µs</text><text x="188" y="160" font-size="12.5" fill="#0b0b0b" text-anchor="end">Core</text><path d="M200 141h256.85a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-256.85z" fill="#2a78d6"><title>Core, Saranga: 111 µs</title></path><text x="466.85" y="152" font-size="11.5" fill="#52514e" stroke="#fcfcfb" stroke-width="3" paint-order="stroke" style="font-variant-