<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Throughput with a JVM client and with a Rust one</text><text x="24" y="59" font-size="12.5" fill="#52514e">Messages received a second with an unbounded producer: higher is better.</text><text x="24" y="77" font-size="12.5" fill="#52514e">The Java clients are Artemis's perf client for Core and Load.java for STOMP and MQTT.</text><rect x="24" y="90" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="100" font-size="12.5" fill="#0b0b0b">Saranga</text><rect x="116.5" y="90" width="12" height="12" rx="3" fill="#eb6834"/><text x="134.5" y="100" font-size="12.5" fill="#0b0b0b">Artemis</text><line x1="200" x2="200" y1="126" y2="478" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="494" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text><line x1="317.5" x2="317.5" y1="126" y2="478" stroke="#e1e0d9" stroke-width="1"/><text x="317.5" y="494" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50K</text><line x1="435" x2="435" y1="126" y2="478" stroke="#e1e0d9" stroke-width="1"/><text x="435" y="494" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100K</text><line x1="552.5" x2="552.5" y1="126" y2="478" stroke="#e1e0d9" stroke-width="1"/><text x="552.5" y="494" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">150K</text><line x1="670" x2="670" y1="126" y2="478" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="494" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200K</text><text x="188" y="152" font-size="12.5" fill="#0b0b0b" text-anchor="end">Core, Java client</text><path d="M200 133h186.25365a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-186.25365z" fill="#2a78d6"><title>Core, Java client, Saranga: 80,959</title></path><text x="396.25365" y="144" font-size="11.5" fill="#52514e" str