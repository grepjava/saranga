<title id="title">Throughput with a JVM client and with a Rust one</title>
<desc id="desc">Core, Java client: Saranga 80,959, Artemis 75,688; Core, Rust client: Saranga 176,402, Artemis 92,934; Core, persistent, Java client: Saranga 77,820, Artemis 64,336; Core, persistent, Rust client: Saranga 122,920, Artemis 87,521; AMQP, Java client: Saranga 29,166, Artemis 31,205; AMQP, Rust client: Saranga 64,457, Artemis 52,685; AMQP, persistent, Java client: Saranga 32,216, Artemis 26,502; AMQP, persistent, Rust client: Saranga 44,020, Artemis 18,651; STOMP, Java client: Saranga 128,752, Artemis 87,400; STOMP, Rust client: Saranga 139,747, Artemis 90,223; MQTT, QoS 0, Java client: Saranga 158,602, Artemis 95,303; MQTT, QoS 0, Rust client: Saranga 159,523, Artemis 94,201</desc>
<rect width="760" height="718" rx="8" fill="#fcfcfb"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Throughput with a JVM client and with a Rust one</text><text x="24" y="59" font-size="12.5" fill="#52514e">Messages received a second with an unbounded producer: higher is better.</text><text x="24" y="77" font-size="12.5" fill="#52514e">The Java clients are Artemis's perf client for Core and AMQP and Load.java for STOMP and MQTT; the Rust ones,</text><text x="24" y="95" font-size="12.5" fill="#52514e">scripts/bench/load for Core, STOMP and MQTT and saranga perf client for AMQP.</text><rect x="24" y="108" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="118" font-size="12.5" fill="#0b0b0b">Saranga</text><rect x="116.5" y="108" width="12" height="12" rx="3" fill="#eb6834"/><text x="134.5" y="118" font-size="12.5" fill="#0b0b0b">Artemis</text><line x1="200" x2="200" y1="144" y2="672" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="688" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text><line x1="317.5" x2="317.5" y1="144" y2="672" stroke="#e1e0d9" stroke-width="1"/><text x="317.5" y="688" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50K</text><line x1="435" x2="435" y1="144" y2="672" stroke="#e1e0d9" stroke-width="1"/><text x="435" y="688" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100K</text><line x1="552.5" x2="552.5" y1="144" y2="672" stroke="#e1e0d9" stroke-width="1"/><text x="552.5" y="688" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">150K</text><line x1="670" x2="670" y1="144" y2="672" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="688" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200K</text><text x="188" y="170" font-size="12.5" fill="#0b0b0b" text-anchor="end">Core, Java client</text><path d="M200 151h186.25365a4 4 0 0 1 4 4v6a