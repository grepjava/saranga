<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Throughput: Saranga against Artemis</text><text x="24" y="59" font-size="12.5" fill="#52514e">Messages received a second with an unbounded producer, as a multiple of Artemis's, each broker's</text><text x="24" y="77" font-size="12.5" fill="#52514e">best figure with either client (Java or Rust). Past the line Saranga is faster; short of it, slower.</text><line x1="200" x2="200" y1="110" y2="470" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0×</text><line x1="294" x2="294" y1="110" y2="470" stroke="#e1e0d9" stroke-width="1"/><text x="294" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.5×</text><line x1="388" x2="388" y1="110" y2="470" stroke="#e1e0d9" stroke-width="1"/><text x="388" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1×</text><line x1="482" x2="482" y1="110" y2="470" stroke="#e1e0d9" stroke-width="1"/><text x="482" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1.5×</text><line x1="576" x2="576" y1="110" y2="470" stroke="#e1e0d9" stroke-width="1"/><text x="576" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2×</text><line x1="670" x2="670" y1="110" y2="470" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="486" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2.5×</text><line x1="388" x2="388" y1="104" y2="470" stroke="#52514e" stroke-width="1.5"/><text x="388" y="100" font-size="11" fill="#52514e" text-anchor="middle">Artemis</text><text x="188" y="129" font-size="12.5" fill="#0b0b0b" text-anchor="end">Core</text><path d="M200 117h352.85084038134596a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-352.85084038134596z" fill="#2a78d6"><tit