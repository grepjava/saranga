<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="title">Startup: lower is better</title>
<desc id="desc">Time to the acceptor, Startup: Saranga 190 ms, Artemis 2,735 ms; Resident memory when started, Memory: Saranga 42 MiB, Artemis 206 MiB</desc>
<rect width="760" height="332" rx="8" fill="#fcfcfb"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#0b0b0b">Startup: lower is better</text><text x="24" y="59" font-size="12.5" fill="#52514e">From launching the broker to its acceptor taking a connection (median of five), and its memory then.</text><rect x="24" y="72" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="82" font-size="12.5" fill="#0b0b0b">Saranga</text><rect x="116.5" y="72" width="12" height="12" rx="3" fill="#eb6834"/><text x="134.5" y="82" font-size="12.5" fill="#0b0b0b">Artemis</text><text x="24" y="122" font-size="13" font-weight="600" fill="#0b0b0b">Time to the acceptor</text><line x1="200" x2="200" y1="134" y2="178" stroke="#c3c2b7" stroke-width="1"/><text x="200" y="194" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0 ms</text><line x1="356.66666666666663" x2="356.66666666666663" y1="134" y2="178" stroke="#e1e0d9" stroke-width="1"/><text x="356.66666666666663" y="194" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000 ms</text><line x1="513.3333333333333" x2="513.3333333333333" y1="134" y2="178" stroke="#e1e0d9" stroke-width="1"/><text x="513.3333333333333" y="194" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2,000 ms</text><line x1="670" x2="670" y1="134" y2="178" stroke="#e1e0d9" stroke-width="1"/><text x="670" y="194" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">3,000 ms</text><text x="188" y="160" font-size="12.5" fill="#0b0b0b" text-anchor="end">Startup</text><path d="M200 141h25.76666666666668a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-25.76666666666668z" fill="#2a78d6"><title>Startup, Saranga: 190 ms</title></path><text x="235.76666666666668" y="152" font-size="11.5" fill="#52514e" stroke="#fcfcfb" stroke-width="3" paint-order="stroke" style="font-variant-numeric: tabular-nums">190 ms</text><path d="M200 157h424.48333333333335a4 4 0 0 1